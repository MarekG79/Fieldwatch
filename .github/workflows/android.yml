name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  build:
    name: APK
    runs-on: ubuntu-latest
    needs: test
    # contents: write lets the job publish a GitHub Release with the APK.
    permissions:
      contents: write
    env:
      # versionCode = 100000 + build number (app/build.gradle.kts), so each Release is newer.
      ANTIDRON_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0"

      # Your own signing key from repository secrets. Same key every build, so a new
      # APK installs over the old one and keeps its data. Without secrets: debug build.
      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No KEYSTORE_BASE64 secret: building a debug APK (new random key each run, it will not update over an older install)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Copying a long line can add breaks, spaces or quotes; keep base64 characters only.
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
          echo "KEYSTORE_BASE64: ${#CLEAN} base64 characters after cleanup (expected about 5736)."
          if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. Paste the whole line again from github-secrets.txt."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore does not open: the base64 line is cut short or KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          # A PKCS12 store has one password for the store and the key, so the key uses
          # KEYSTORE_PASSWORD. Pasted values can carry invisible characters: keep printable ASCII.
          ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -cd '[:graph:]')
          {
            echo "FIELDWATCH_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "FIELDWATCH_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FIELDWATCH_KEY_ALIAS=$ALIAS"
            echo "FIELDWATCH_KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } > local.properties
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::No key named '$ALIAS' in the keystore. KEY_ALIAS should be: antidron"
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble signed release APK
        if: steps.signing.outputs.signed == 'true'
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/antidron-${GITHUB_RUN_NUMBER}.apk"

      - name: Assemble debug APK
        if: steps.signing.outputs.signed != 'true'
        run: |
          ./gradlew assembleDebug --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/antidron-${GITHUB_RUN_NUMBER}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antidron-apk
          path: out/*.apk
          if-no-files-found: error

      # Every signed build of main becomes a Release, so the APK is one tap away on
      # the Releases page. Pull-request builds stay as workflow artifacts only.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="antidron-${GITHUB_RUN_NUMBER}"
          {
            echo "Podpísané APK aplikácie Antidron, build ${GITHUB_RUN_NUMBER}."
            echo
            echo "Inštalácia: stiahni súbor .apk nižšie a otvor ho v telefóne. Nainštaluje sa cez predchádzajúcu verziu a zachová dáta."
            echo
            echo "Zmeny od predchádzajúceho buildu:"
            git log -1 --pretty='- %s'
          } > notes.md
          # The in-app updater reads releases/latest/download/app-update.json and Antidron.apk.
          mkdir -p rel
          cp "out/antidron-${GITHUB_RUN_NUMBER}.apk" rel/Antidron.apk
          NAME=$(sed -n 's/^ *versionName = "\([0-9.]*\)".*/\1/p' app/build.gradle.kts | head -1)
          SUBJECT=$(git log -1 --pretty='%s')
          NOTES=$(printf 'Antidron %s\n\n%s\n\nNastavenia, hliadky aj uložené udalosti zostanú.' "$GITHUB_RUN_NUMBER" "$SUBJECT")
          jq -n --argjson code "$((100000 + GITHUB_RUN_NUMBER))" --arg name "$NAME" --arg notes "$NOTES" \
            '{versionCode: $code, versionName: $name, notes: $notes}' > rel/app-update.json
          cat rel/app-update.json
          gh release create "$TAG" out/*.apk rel/Antidron.apk rel/app-update.json \
            --target "$GITHUB_SHA" \
            --title "Antidron ${GITHUB_RUN_NUMBER}" \
            --notes-file notes.md \
            --latest

      - name: Remove signing files
        if: always()
        run: rm -f local.properties "$RUNNER_TEMP/release.jks"
